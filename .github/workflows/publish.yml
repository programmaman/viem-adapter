name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Validate release metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
          grep -q "^## ${VERSION}\( \|$\)" CHANGELOG.md
          awk -v version="$VERSION" '$0 ~ "^## " version "( |$)" { found=1; print; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
      - run: npm test
      - run: npm run pack:check
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "@rakelabs/viem-adapter $GITHUB_REF_NAME" --notes-file release-notes.md
      - run: npm publish --provenance --access public
